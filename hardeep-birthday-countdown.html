<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hardeep Kaur's Birthday Countdown</title>
<style>
  :root {
    --pink: #ff5ca8;
    --purple: #7b2ff7;
    --gold: #ffd166;
    --card-bg: rgba(255,255,255,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #1e0033, #4a0072, #ff5ca8);
    background-size: 400% 400%;
    animation: gradientShift 12s ease infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow-x: hidden;
    position: relative;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .container {
    background: var(--card-bg);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 24px;
    padding: 48px 36px;
    max-width: 520px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    position: relative;
    z-index: 2;
  }

  .photo-wrap {
    width: 160px;
    height: 160px;
    margin: 0 auto 20px;
    border-radius: 50%;
    overflow: hidden;
    border: 4px solid var(--gold);
    box-shadow: 0 0 30px rgba(255, 209, 102, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.15);
  }

  .photo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .photo-placeholder {
    color: #fff;
    font-size: 14px;
    opacity: 0.85;
    padding: 10px;
  }

  h1 {
    color: #fff;
    font-size: 28px;
    margin-bottom: 4px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.3);
  }

  h1 span {
    color: var(--gold);
  }

  .subtitle {
    color: rgba(255,255,255,0.85);
    font-size: 15px;
    margin-bottom: 28px;
  }

  .countdown {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }

  .time-box {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 16px;
    padding: 16px 14px;
    min-width: 78px;
  }

  .time-box .num {
    font-size: 32px;
    font-weight: 700;
    color: #fff;
    line-height: 1;
    text-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }

  .time-box .label {
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--gold);
    margin-top: 6px;
  }

  .message {
    color: #fff;
    font-size: 16px;
    line-height: 1.6;
    background: rgba(255,255,255,0.1);
    padding: 16px;
    border-radius: 14px;
    display: none;
  }

  .balloons {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }

  .balloon {
    position: absolute;
    bottom: -100px;
    width: 40px;
    height: 52px;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    opacity: 0.75;
    animation: floatUp linear infinite;
  }

  @keyframes floatUp {
    0% { transform: translateY(0) translateX(0) rotate(0deg); }
    100% { transform: translateY(-115vh) translateX(20px) rotate(10deg); }
  }

  footer {
    margin-top: 22px;
    font-size: 12px;
    color: rgba(255,255,255,0.6);
  }
</style>
</head>

  <h1>Happy Birthday, <span>Hardeep Kaur</span>!</h1>
  <p class="subtitle">Counting down to 24th December 🎂</p>

  <div class="countdown" id="countdown">
    <div class="time-box"><div class="num" id="days">00</div><div class="label">Days</div></div>
    <div class="time-box"><div class="num" id="hours">00</div><div class="label">Hours</div></div>
    <div class="time-box"><div class="num" id="minutes">00</div><div class="label">Minutes</div></div>
    <div class="time-box"><div class="num" id="seconds">00</div><div class="label">Seconds</div></div>
  </div>

  <div class="message" id="birthdayMessage">
    🎉 It's Hardeep Kaur's Birthday! 🎉<br>
    Wishing you a day filled with love, laughter, and cake! 🎂🎈
  </div>

  <footer>Made with ❤️ for Hardeep Kaur</footer>
</div>

<script>
  // Set the target birthday date (24th December). Uses current or next occurrence.
  function getNextBirthday() {
    const now = new Date();
    const year = now.getFullYear();
    let target = new Date(year, 11, 24, 0, 0, 0); // Month is 0-indexed: 11 = December
    if (now > target) {
      target = new Date(year + 1, 11, 24, 0, 0, 0);
    }
    return target;
  }

  let birthdayDate = getNextBirthday();

  function updateCountdown() {
    const now = new Date().getTime();
    const distance = birthdayDate.getTime() - now;

    if (distance <= 0) {
      document.getElementById('countdown').style.display = 'none';
      document.getElementById('birthdayMessage').style.display = 'block';
      // Recalculate for next year in case page stays open
      birthdayDate = getNextBirthday();
      return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

    document.getElementById('days').textContent = String(days).padStart(2, '0');
    document.getElementById('hours').textContent = String(hours).padStart(2, '0');
    document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
    document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);

  // Floating balloons background decoration
  const colors = ['#ff5ca8', '#7b2ff7', '#ffd166', '#06d6a0', '#ef476f'];
  const balloonsContainer = document.getElementById('balloons');

  function createBalloon() {
    const balloon = document.createElement('div');
    balloon.className = 'balloon';
    balloon.style.left = Math.random() * 100 + 'vw';
    balloon.style.background = colors[Math.floor(Math.random() * colors.length)];
    const duration = 8 + Math.random() * 6;
    balloon.style.animationDuration = duration + 's';
    balloonsContainer.appendChild(balloon);
    setTimeout(() => balloon.remove(), duration * 1000);
  }

  setInterval(createBalloon, 1200);
  for (let i = 0; i < 5; i++) setTimeout(createBalloon, i * 400);
</script>
